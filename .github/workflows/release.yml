name: macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build Apple Silicon app and draft release
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: go1.27.3
      # Keep cold builds of generated Telegram bindings within runner memory.
      GOFLAGS: '-p=1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_macos_release.py "$RELEASE_TAG" --check-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.3
          cache-dependency-path: |
            backend/go.mod
            thumbnail-helper/go.sum
            runtime/tdl/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Run automated checks
        run: |
          make test
          make test-flutter
          make smoke
      - name: Install pinned security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Check source, secrets and dependencies
        run: make security
      - name: Build complete macOS app
        run: ./scripts/build_macos_app.sh
      - name: Scan bundled Go executables
        run: |
          app="apps/desktop/build/macos/Build/Products/Release/Telegram Media Downloader.app/Contents/MacOS"
          govulncheck -mode binary "$app/telegram-media-downloader-backend"
          govulncheck -mode binary "$app/tdl-tmm"
          govulncheck -mode binary "$app/tdl-tmm-previews-v3"
      - name: Package DMG and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_macos_release.py "$RELEASE_TAG"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="build/releases/$RELEASE_TAG/RELEASE_NOTES.md"
          cat > "$notes" <<EOF_NOTES
          ## Install
          Download the macOS Apple Silicon DMG below, open it and drag the app into Applications.
          Follow the [installation and Telegram login instructions](https://github.com/$GH_REPO/blob/$RELEASE_TAG/README.md#telegram-login).

          ## Build details
          - Apple Silicon (M1 or later); macOS 13 is the build target.
          - Built on macOS $(sw_vers -productVersion); automated checks ran on that runner.
          - Ad-hoc signed and not notarized. Follow [Apple's first-launch guidance](https://support.apple.com/en-us/102445) if needed.
          - tdl 0.20.4 with patched dependencies is bundled; no separate tdl installation is required.
          - Verify the download with the attached SHA256SUMS.txt.

          ## Changes and limitations
          See the [changelog](https://github.com/$GH_REPO/blob/$RELEASE_TAG/CHANGELOG.md).
          First-time login uses Terminal. This download is for Apple Silicon Macs.
          EOF_NOTES
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "build/releases/$RELEASE_TAG/Telegram-Media-Downloader-$RELEASE_TAG-macos-arm64.dmg" \
            "build/releases/$RELEASE_TAG/SHA256SUMS.txt" \
            --verify-tag --draft --title "Telegram Media Downloader $RELEASE_TAG" \
            --notes-file "$notes" "${flags[@]}"
